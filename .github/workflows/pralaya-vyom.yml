name: 🌀 Pralaya Vyom (The Dissolution of Vyom)
on:
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  manifest:
    name: Pralaya Vyom
    runs-on: self-hosted

    # Use environment to separate dev/prod if needed later
    environment: production

    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔑 Load Secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          # This token must be added to GitHub Repository Secrets
          export-env: true
        env:
          # Map required secrets for the Makefile/IaC
          # Format: ENV_VAR: op://Vault/Item/Field
          R2_SECRET_ACCESS_KEY: op://Project-Brahmanda/Cloudflare-Sanchay-Token/R2_SECRET_ACCESS_KEY

      - name: 🛤️ Configure PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🚀 Initialize Environment
        run: |
          # Ensure all tools are installed and up to date
          make init

      - name: 🔐 Fix Permissions
        run: chmod +x samsara/ansible/inventory/dynamic_inventory.py

      - name: 🌊 Run Pralaya Vyom (Dissolution of Vyom into the Primal Matter)
        run: make pralaya-vyom
