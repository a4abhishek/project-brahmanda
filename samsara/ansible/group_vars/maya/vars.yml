# samsara/ansible/group_vars/maya/vars.yml
#
# Non-secret variables for Maya (GitOps Facade) group.
---

# ArgoCD Configuration
argocd_namespace: "argocd"
argocd_version: "v3.3.0"  # Latest stable (breaking changes only affect upgrades/self-management, not fresh installs)

# ArgoCD Image Updater Configuration
argocd_image_updater_version: "v1.1.0"  # First major release! (Released 2026-02-05)

# K3s Configuration
kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"

# Domain Configuration
domain_name: "abhishek-kashyap.com"

# Brahmanda Sutra Repository (Application Manifests)
brahmanda_sutra_repo: "https://github.com/a4abhishek/brahmanda-sutra.git"
