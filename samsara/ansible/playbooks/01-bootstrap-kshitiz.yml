---
- name: Bootstrap Kshitiz (Edge) Lighthouse
  hosts: kshitiz
  become: true  # This tells Ansible to use 'sudo' for the tasks.
  vars_files: # This tells ansible exactly in which order to load variable files. It is a good practice.
    - ../group_vars/brahmanda/vault.yml
    - ../group_vars/kshitiz/vars.yml
    - ../group_vars/kshitiz/vault.yml

  gather_facts: false # Wait for connection first

  pre_tasks:
    - name: ⏳ Wait for SSH Connection
      wait_for_connection:
        delay: 0
        timeout: 300

    - name: 🔍 Gather Facts
      setup:

  tasks:
    - name: 🛡️ Verify Distributed Lock Ownership (Master Lock)
      ansible.builtin.uri:
        url: "{{ upstash_url | trim }}/GET/brahmanda_lock_srishti"
        headers:
          Authorization: "Bearer {{ upstash_token | trim }}"
        return_content: true
      register: lock_status
      failed_when: lock_status.json.result != (brahmanda_job_id | default('MANUAL_RUN'))
      delegate_to: localhost
      run_once: true
      become: false

    - name: 🛡️ Validate Root Disk Size (Pre-Flight)
      assert:
        that:
          - item.size_total > 10 * 1024 * 1024 * 1024
        msg: "ERROR: Root partition is too small ({{ (item.size_total / 1024 / 1024 / 1024) | round(2) }} GB). Partition resize failed!"
      loop: "{{ ansible_mounts }}"
      when: item.mount == "/"

    - name: 🛡️ Harden SSH Server
      import_tasks: ./tasks/harden_ssh.yml

    - name: 🌀 Install Nebula
      import_tasks: ./tasks/install_nebula.yml

    - name: 📂 Create Nebula configuration directory
      ansible.builtin.file:
        path: /etc/nebula
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 📜 Deploy Nebula CA certificate
      # This copies the public CA cert to the server.
      # The content comes from the 'nebula_ca_crt' variable in your vault.
      ansible.builtin.copy:
        content: "{{ nebula_ca_crt }}"
        dest: /etc/nebula/ca.crt
        owner: root
        group: root
        mode: '0644'

    - name: 📜 Deploy Nebula Lighthouse certificate
      # This copies the lighthouse's own public certificate.
      ansible.builtin.copy:
        content: "{{ nebula_lighthouse_crt }}"
        dest: /etc/nebula/lighthouse.crt
        owner: root
        group: root
        mode: '0644'

    - name: 🔑 Deploy Nebula Lighthouse private key
      # This copies the lighthouse's private key. Note the stricter permissions.
      ansible.builtin.copy:
        content: "{{ nebula_lighthouse_key }}"
        dest: /etc/nebula/lighthouse.key
        owner: root
        group: root
        mode: '0600'  # Only root can read this file.

    - name: 📜 Deploy Nebula Lighthouse configuration file
      # This creates the main config file for Nebula.
      ansible.builtin.template:
        src: nebula-lighthouse-config.yml.j2
        dest: /etc/nebula/config.yml
        owner: root
        group: root
        mode: '0644'
      notify: 🔄️ Restart Nebula # This tells Ansible to run the "Restart Nebula" handler if this file changes.

    - name: ⚙️ Deploy Nebula systemd service unit file
      ansible.builtin.copy:
        dest: /etc/systemd/system/nebula.service
        mode: '0644'
        content: |
          [Unit]
          Description=Nebula Overlay Network Service
          Wants=network-online.target
          After=network-online.target
          [Service]
          ExecStart=/usr/local/bin/nebula -config /etc/nebula/config.yml
          Restart=always
          RestartSec=10
          KillMode=process
          [Install]
          WantedBy=multi-user.target
      notify: 🔄️ Reload systemd # Tell systemd to re-read its config

    - name: ☑️ Enable and start Nebula service
      ansible.builtin.systemd:
        name: nebula
        state: started
        enabled: true

    # -------------------------------------------------------------------------
    # Phase 2: Reverse Proxy (Caddy)
    # -------------------------------------------------------------------------
    
    # Create swap to prevent OOM on nano instance (512MB RAM)
    - name: 🔄 Check if swap exists
      ansible.builtin.stat:
        path: /swapfile
      register: swap_file

    - name: 💾 Create swap file (1GB)
      ansible.builtin.command: |
        fallocate -l 1G /swapfile
      when: not swap_file.stat.exists

    - name: 🔒 Set swap file permissions
      ansible.builtin.file:
        path: /swapfile
        mode: '0600'
      when: not swap_file.stat.exists

    - name: 💾 Format swap file
      ansible.builtin.command: mkswap /swapfile
      when: not swap_file.stat.exists

    - name: ☑️ Enable swap
      ansible.builtin.command: swapon /swapfile
      when: not swap_file.stat.exists

    - name: 📋 Add swap to fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: '/swapfile none swap sw 0 0'
        state: present
      when: not swap_file.stat.exists

    - name: 📦 Install Caddy dependencies
      ansible.builtin.apt:
        name: 
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
        state: present
        update_cache: yes

    - name: 🔑 Add Caddy GPG Key
      ansible.builtin.shell: |
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

    - name: 📋 Add Caddy Repository
      ansible.builtin.shell: |
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
      args:
        creates: /etc/apt/sources.list.d/caddy-stable.list

    - name: 📦 Install Caddy Package
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: yes

    - name: 📜 Deploy Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: '0644'
      notify: 🔄️ Restart Caddy

    - name: ☑️ Enable and start Caddy service
      ansible.builtin.systemd:
        name: caddy
        state: started
        enabled: true

  handlers:
    - import_tasks: ./handlers/main.yml

    - name: 🔄️ Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: 🔄️ Restart Nebula
      ansible.builtin.systemd:
        name: nebula
        state: restarted

    - name: 🔄️ Restart Caddy
      ansible.builtin.systemd:
        name: caddy
        state: restarted
