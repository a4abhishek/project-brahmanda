---
- name: Bootstrap Kshitiz (Edge) Lighthouse
  hosts: kshitiz
  become: true  # This tells Ansible to use 'sudo' for the tasks.
  vars_files: # This tells ansible exactly in which order to load variable files. It is a good practice.
    - ../group_vars/brahmanda/vault.yml
    - ../group_vars/kshitiz/vars.yml
    - ../group_vars/kshitiz/vault.yml

  gather_facts: false # Wait for connection first

  pre_tasks:
    - name: ⏳ Wait for SSH Connection
      wait_for_connection:
        delay: 0
        timeout: 300

    - name: 🔍 Gather Facts
      setup:

  tasks:
    - name: 🛡️ Verify Distributed Lock Ownership (Master Lock)
      ansible.builtin.uri:
        url: "{{ upstash_url | trim }}/GET/brahmanda_lock_srishti"
        headers:
          Authorization: "Bearer {{ upstash_token | trim }}"
        return_content: true
      register: lock_status
      failed_when: lock_status.json.result != (brahmanda_job_id | default('MANUAL_RUN'))
      delegate_to: localhost
      run_once: true
      become: false

    - name: 🛡️ Validate Root Disk Size (Pre-Flight)
      assert:
        that:
          - item.size_total > 10 * 1024 * 1024 * 1024
        msg: "ERROR: Root partition is too small ({{ (item.size_total / 1024 / 1024 / 1024) | round(2) }} GB). Partition resize failed!"
      loop: "{{ ansible_mounts }}"
      when: item.mount == "/"

    - name: 🛡️ Harden SSH Server
      import_tasks: ./tasks/harden_ssh.yml

    - name: 🌀 Install Nebula
      import_tasks: ./tasks/install_nebula.yml

    - name: 📂 Create Nebula configuration directory
      ansible.builtin.file:
        path: /etc/nebula
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 📜 Deploy Nebula CA certificate
      # This copies the public CA cert to the server.
      # The content comes from the 'nebula_ca_crt' variable in your vault.
      ansible.builtin.copy:
        content: "{{ nebula_ca_crt }}"
        dest: /etc/nebula/ca.crt
        owner: root
        group: root
        mode: '0644'

    - name: 📜 Deploy Nebula Lighthouse certificate
      # This copies the lighthouse's own public certificate.
      ansible.builtin.copy:
        content: "{{ nebula_lighthouse_crt }}"
        dest: /etc/nebula/lighthouse.crt
        owner: root
        group: root
        mode: '0644'

    - name: 🔑 Deploy Nebula Lighthouse private key
      # This copies the lighthouse's private key. Note the stricter permissions.
      ansible.builtin.copy:
        content: "{{ nebula_lighthouse_key }}"
        dest: /etc/nebula/lighthouse.key
        owner: root
        group: root
        mode: '0600'  # Only root can read this file.

    - name: 📜 Deploy Nebula Lighthouse configuration file
      # This creates the main config file for Nebula.
      ansible.builtin.template:
        src: nebula-lighthouse-config.yml.j2
        dest: /etc/nebula/config.yml
        owner: root
        group: root
        mode: '0644'
      notify: 🔄️ Restart Nebula # This tells Ansible to run the "Restart Nebula" handler if this file changes.

    - name: ⚙️ Deploy Nebula systemd service unit file
      ansible.builtin.copy:
        dest: /etc/systemd/system/nebula.service
        mode: '0644'
        content: |
          [Unit]
          Description=Nebula Overlay Network Service
          Wants=network-online.target
          After=network-online.target
          [Service]
          ExecStart=/usr/local/bin/nebula -config /etc/nebula/config.yml
          Restart=always
          RestartSec=10
          KillMode=process
          [Install]
          WantedBy=multi-user.target
      notify: 🔄️ Reload systemd # Tell systemd to re-read its config

    - name: ☑️ Enable and start Nebula service
      ansible.builtin.systemd:
        name: nebula
        state: started
        enabled: true

  handlers:
    - import_tasks: ./handlers/main.yml

    - name: 🔄️ Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: 🔄️ Restart Nebula
      ansible.builtin.systemd:
        name: nebula
        state: restarted
