---
# -----------------------------------------------------------------------------
# 🕉️ Srishti: Vyom Cluster Manifestation
# -----------------------------------------------------------------------------
# This playbook bootstraps the Kubernetes cluster.
# Strategy: "Split-Horizon"
#   1. Data Plane: Physical LAN (High Speed)
#   2. Control Plane: Nebula Mesh (High Security)
# -----------------------------------------------------------------------------

- name: Manifest Vyom Cluster (Compute Plane)
  hosts: k3s_cluster
  become: true

  # Load variables hierarchy:
  # 1. Group Vars (Common settings)
  # 2. Host Vars (Specific identities/Nidhi)
  vars_files:
    - ../group_vars/brahmanda/vault.yml
    - ../group_vars/vyom/vars.yml
    - ../group_vars/vyom/vault.yml
    - "../host_vars/{{ inventory_hostname }}/vault.yml"

  gather_facts: false # Wait for connection first

  # ---------------------------------------------------------------------------
  # Global Variables (High Precedence)
  # ---------------------------------------------------------------------------
  vars:
    # --- Nebula Configuration ---
    nebula_version: "1.10.0" # Force this version

    # Identity (Certificate paths on target nodes)
    pki:
      ca: /etc/nebula/ca.crt
      cert: /etc/nebula/host.crt
      key: /etc/nebula/host.key

    # Network Configuration
    listen:
      host: 0.0.0.0
      port: 4242

    tun:
      disabled: false
      dev: nebula1 # Default. But explicitly set interface name for consistency

    # Firewall Rules - Group-based security
    # Groups: kshitiz (edge gateway), vyom (all compute nodes)
    outbound:
      - port: any
        proto: any
        host: any

    inbound:
      # Allow ICMP from any Nebula host for connectivity testing
      - port: any
        proto: icmp
        host: any
      
      # Allow SSH from kshitiz only (management from edge bastion)
      - port: 22
        proto: tcp
        groups:
          - kshitiz
      
      # Allow K3s API from kshitiz and vyom (cluster access + inter-node)
      - port: 6443
        proto: tcp
        groups:
          - kshitiz
          - vyom
      
      # Allow HTTP/HTTPS from edge only (ingress traffic from internet)
      - port: 80
        proto: tcp
        groups:
          - kshitiz
      - port: 443
        proto: tcp
        groups:
          - kshitiz
      
      # Allow all inter-cluster communication (compute-to-compute)
      - port: any
        proto: any
        groups:
          - vyom

  # ---------------------------------------------------------------------------
  # Phase 0: Validation & Preparation
  # ---------------------------------------------------------------------------
  pre_tasks:
    - name: ⏳ Wait for SSH Connection
      wait_for_connection:
        delay: 0
        timeout: 300

    - name: 🔍 Gather Facts
      setup:

    - name: 🛡️ Verify Distributed Lock Ownership (Master Lock)
      ansible.builtin.uri:
        url: "{{ upstash_url | trim }}/GET/brahmanda_lock_srishti"
        headers:
          Authorization: "Bearer {{ upstash_token | trim }}"
        return_content: true
      register: lock_status
      failed_when: lock_status.json.result != (brahmanda_job_id | default('MANUAL_RUN'))
      delegate_to: localhost
      run_once: true
      become: false

    - name: 🛡️ Validate Root Disk Size (Pre-Flight)
      assert:
        that:
          - item.size_total > 10 * 1024 * 1024 * 1024
        msg: "ERROR: Root partition is too small ({{ (item.size_total / 1024 / 1024 / 1024) | round(2) }} GB). Partition resize failed!"
      loop: "{{ ansible_mounts }}"
      when: item.mount == "/"

    - name: 🛡️ Verify Identity Existence
      fail:
        msg: "Identity missing for {{ inventory_hostname }}. Ensure 'nebula_node_crt' and 'nebula_node_key' are defined."
      when: nebula_node_crt is undefined or nebula_node_key is undefined
      # Note: variables mapped from group_vars/vyom/vault.yml
      ignore_errors: true

    - name: 🔍 Check Installed Nebula Version
      command: /usr/bin/nebula --version
      register: installed_nebula_version
      ignore_errors: true
      changed_when: false

    - name: 🧹 Cleanup Old Nebula Binaries (Force Upgrade)
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - /usr/bin/nebula
        - /usr/bin/nebula-cert
        - /usr/local/bin/nebula
        - /usr/local/bin/nebula-cert
      when: installed_nebula_version.rc != 0 or nebula_version not in installed_nebula_version.stdout
      tags: [cleanup]

    - name: 📂 Create Nebula Configuration Directory
      file:
        path: /etc/nebula
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: 📜 Place Nebula CA Certificate
      copy:
        content: "{{ nebula_ca_crt | trim }}"
        dest: /etc/nebula/ca.crt
        mode: '0644'
        owner: root
        group: root

    - name: 📜 Place Nebula Node Certificate
      copy:
        content: "{{ nebula_node_crt | trim }}"
        dest: /etc/nebula/host.crt
        mode: '0644'
        owner: root
        group: root

    - name: 🔑 Place Nebula Node Key
      copy:
        content: "{{ nebula_node_key | trim }}"
        dest: /etc/nebula/host.key
        mode: '0600' # Private keys must be secure
        owner: root
        group: root

    # --- Role & Fact Setup (Crucial for Cluster Join) ---
    - name: 🧠 Set K3s Node Type Facts
      set_fact:
        k3s_control_node: "{{ inventory_hostname in groups['vyom_control_plane'] }}"
        k3s_agent_node: "{{ inventory_hostname in groups['vyom_workers'] }}"
      # These facts are required by the role to inspect other nodes via hostvars

  # ---------------------------------------------------------------------------
  # Phase 1: The Mesh (Nebula)
  # ---------------------------------------------------------------------------
  tasks:
    # -------------------------------------------------------------------------
    # Phase 1: Deploy Nebula (Custom Implementation - Role-Free)
    # -------------------------------------------------------------------------
    - name: 📥 Download Nebula Binary
      ansible.builtin.get_url:
        url: "https://github.com/slackhq/nebula/releases/download/v{{ nebula_version }}/nebula-linux-amd64.tar.gz"
        dest: "/tmp/nebula-{{ nebula_version }}-linux-amd64.tar.gz"
        mode: '0644'

    - name: 📦 Extract Nebula Binary
      ansible.builtin.unarchive:
        src: "/tmp/nebula-{{ nebula_version }}-linux-amd64.tar.gz"
        dest: /tmp/
        remote_src: yes

    - name: 📥 Install Nebula Binary
      ansible.builtin.copy:
        src: /tmp/nebula
        dest: /usr/bin/nebula
        mode: '0755'
        owner: root
        group: root
        remote_src: yes

    - name: 📥 Install Nebula-Cert Binary
      ansible.builtin.copy:
        src: /tmp/nebula-cert
        dest: /usr/bin/nebula-cert
        mode: '0755'
        owner: root
        group: root
        remote_src: yes

    - name: 📝 Generate Nebula Configuration from Template
      ansible.builtin.template:
        src: nebula-node-config.yaml.j2
        dest: /etc/nebula/config.yaml
        mode: '0644'
        owner: root
        group: root

    - name: 📝 Create Nebula Systemd Service from Template
      ansible.builtin.template:
        src: nebula.service.j2
        dest: /etc/systemd/system/nebula.service
        mode: '0644'
        owner: root
        group: root

    - name: 🔄 Reload Systemd Daemon
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: 🚀 Enable and Start Nebula Service
      ansible.builtin.systemd:
        name: nebula
        enabled: yes
        state: started
    # -------------------------------------------------------------------------
    # Phase 1.5: Verify Nebula Installation (CRITICAL)
    # -------------------------------------------------------------------------
    - name: 🔍 Verify Nebula Binaries Installed
      ansible.builtin.stat:
        path: "{{ item }}"
      register: nebula_binaries
      failed_when: not nebula_binaries.stat.exists or not nebula_binaries.stat.executable
      loop:
        - /usr/bin/nebula
        - /usr/bin/nebula-cert

    - name: 🔍 Verify Nebula Version
      ansible.builtin.command: /usr/bin/nebula --version
      register: nebula_version_check
      changed_when: false
      failed_when: nebula_version not in nebula_version_check.stdout

    - name: 🔍 Verify Nebula Certificates Exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: nebula_certs
      failed_when: not nebula_certs.stat.exists
      loop:
        - /etc/nebula/ca.crt
        - /etc/nebula/host.crt
        - /etc/nebula/host.key

    - name: 🔍 Verify Certificate Contains Correct Node IP
      ansible.builtin.shell: |
        /usr/bin/nebula-cert print -path /etc/nebula/host.crt
      changed_when: false
      register: cert_content

    - name: ℹ️ Display Certificate Info
      ansible.builtin.debug:
        msg: "{{ cert_content.stdout }}"

    - name: 🔍 Validate Certificate Has Nebula Network Range
      ansible.builtin.shell: |
        /usr/bin/nebula-cert print -path /etc/nebula/host.crt | grep -q "10.100"
      changed_when: false
      register: cert_network_check
      failed_when: cert_network_check.rc != 0

    - name: 📋 Extract Node IP from Certificate
      ansible.builtin.shell: |
        /usr/bin/nebula-cert print -path /etc/nebula/host.crt | grep "10.100" | grep -oE "10\.42\.[0-9]+\.[0-9]+" | head -1
      changed_when: false
      register: nebula_node_ip_extracted

    - name: ℹ️ Display Extracted Node IP
      ansible.builtin.debug:
        msg: "Nebula node IP from certificate: {{ nebula_node_ip_extracted.stdout }}"

    - name: 🔍 Verify Nebula Config File Exists
      ansible.builtin.stat:
        path: /etc/nebula/config.yaml
      register: nebula_config_stat
      failed_when: not nebula_config_stat.stat.exists

    - name: 🔍 Verify Nebula Config Contains Lighthouse IP
      ansible.builtin.shell: |
        grep -q "10.100.0.1" /etc/nebula/config.yaml
      changed_when: false
      failed_when: false
      register: lighthouse_check

    - name: 🔍 Verify Static Host Map Contains Kshitiz Public IP
      ansible.builtin.shell: |
        grep -A 3 "static_host_map:" /etc/nebula/config.yaml | grep -q "{{ hostvars['kshitiz-lighthouse']['ansible_host'] }}"
      changed_when: false
      failed_when: false
      register: static_map_check

    - name: ⚠️ Display Config if Lighthouse Missing
      ansible.builtin.shell: cat /etc/nebula/config.yaml
      when: lighthouse_check.rc != 0 or static_map_check.rc != 0
      register: nebula_config_content
      changed_when: false

    - name: 💥 Fail if Lighthouse Not in Config
      ansible.builtin.fail:
        msg: |
          Nebula configuration missing lighthouse 10.100.0.1!
          Config content:
          {{ nebula_config_content.stdout | default('Could not read config') }}
      when: lighthouse_check.rc != 0

    - name: 💥 Fail if Static Host Map Missing Kshitiz Public IP
      ansible.builtin.fail:
        msg: |
          Nebula static_host_map missing Kshitiz public IP!
          Expected: {{ hostvars['kshitiz-lighthouse']['ansible_host'] }}
          Config content:
          {{ nebula_config_content.stdout | default('Could not read config') }}
      when: static_map_check.rc != 0

    - name: 🔍 Verify Nebula Service Exists and Active
      ansible.builtin.systemd:
        name: nebula
        state: started
        enabled: yes
      register: nebula_service_result
      failed_when: nebula_service_result.status.ActiveState != "active"

    - name: 🔍 Verify Nebula Process Running
      ansible.builtin.shell: pgrep -x nebula
      changed_when: false
      register: nebula_process_check
      failed_when: nebula_process_check.rc != 0

    - name: 🔍 Verify Nebula Listening on UDP 4242
      ansible.builtin.shell: ss -ulnp | grep -q ":4242"
      changed_when: false
      register: nebula_port_check
      failed_when: false

    - name: ⚠️ Display Nebula Status if Port Check Failed
      ansible.builtin.command: systemctl status nebula --no-pager
      when: nebula_port_check.rc != 0
      register: nebula_status_output
      changed_when: false

    - name: 💥 Fail if Nebula Not Listening
      ansible.builtin.fail:
        msg: |
          Nebula service is not listening on UDP 4242!
          Status:
          {{ nebula_status_output.stdout | default('Unknown') }}
      when: nebula_port_check.rc != 0

    - name: ⏳ Wait for Nebula Interface (nebula1) to Appear
      ansible.builtin.wait_for:
        path: /sys/class/net/nebula1
        timeout: 30
      register: nebula_interface_wait
      failed_when: false

    - name: 💥 Fail if Nebula Interface Not Created
      ansible.builtin.fail:
        msg: |
          Nebula interface 'nebula1' not created after 30 seconds!
          Check Nebula logs: journalctl -u nebula -n 50
      when: nebula_interface_wait.failed

    - name: 🔍 Verify Nebula Interface Has Correct IP
      ansible.builtin.shell: |
        ip addr show nebula1 | grep -q "{{ nebula_node_ip_extracted.stdout }}"
      changed_when: false
      register: interface_ip_check
      failed_when: false
      retries: 5
      delay: 2
      until: interface_ip_check.rc == 0

    - name: 💥 Fail if Interface IP Incorrect
      ansible.builtin.fail:
        msg: |
          Nebula interface 'nebula1' does not have expected IP from certificate!
          Expected (from cert): {{ nebula_node_ip_extracted.stdout }}
          Actual (from interface): {{ ansible_facts.nebula1.ipv4.address | default('Could not determine') }}
      when: interface_ip_check.rc != 0

    - name: ℹ️ Display Nebula Service Status (Success)
      ansible.builtin.debug:
        msg: "✅ Nebula service verified: Running, listening on UDP 4242, interface nebula1 active with IP {{ nebula_node_ip_extracted.stdout }}"

    - name: 🔍 Check Nebula Logs for Critical Errors
      ansible.builtin.shell: |
        journalctl -u nebula -n 50 --no-pager | grep -iE "(error|failed|fatal)" || true
      changed_when: false
      register: nebula_log_errors

    - name: ⚠️ Display Nebula Log Errors (if any)
      ansible.builtin.debug:
        msg: "{{ nebula_log_errors.stdout_lines }}"
      when: nebula_log_errors.stdout != ""

    - name: 🔍 Verify Systemd Service File
      ansible.builtin.stat:
        path: /etc/systemd/system/nebula.service
      register: systemd_service_file
      failed_when: not systemd_service_file.stat.exists

    - name: 📋 Display Generated Nebula Config (Key Sections)
      ansible.builtin.shell: |
        echo "=== Certificate Info ==="
        /usr/bin/nebula-cert print -path /etc/nebula/host.crt | grep -E "(Name|IP)"
        echo ""
        echo "=== Lighthouse Configuration ==="
        grep -A 5 "^lighthouse:" /etc/nebula/config.yaml || echo "No lighthouse section found!"
        echo ""
        echo "=== Static Host Map ==="
        grep -A 3 "^static_host_map:" /etc/nebula/config.yaml || echo "No static_host_map found!"
        echo ""
        echo "=== Punch Configuration ==="
        grep -A 2 "^punchy:" /etc/nebula/config.yaml || echo "No punchy found!"
      register: nebula_config_debug
      changed_when: false

    - name: ℹ️ Show Config Debug Output
      ansible.builtin.debug:
        var: nebula_config_debug.stdout_lines

    # -------------------------------------------------------------------------
    # Phase 2: The Bridge (Discovery)
    # -------------------------------------------------------------------------
    - name: 🔄 Refresh Ansible Facts (Discover nebula1)
      ansible.builtin.setup:
      # Forces Ansible to see the newly created 'nebula1' interface
      # Otherwise 'ansible_facts.nebula1' will remain undefined.

    # -------------------------------------------------------------------------
    # Phase 3: The Cluster (K3s)
    # -------------------------------------------------------------------------
    - name: � Create K3s Manifests Directory (Pre-Bootstrap)
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/manifests
        state: directory
        mode: '0755'
        owner: root
        group: root
      when: inventory_hostname in groups['vyom_control_plane']

    - name: 📝 Create Traefik HelmChartConfig (Enable hostNetwork)
      ansible.builtin.copy:
        dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
        mode: '0644'
        content: |
          apiVersion: helm.cattle.io/v1
          kind: HelmChartConfig
          metadata:
            name: traefik
            namespace: kube-system
          spec:
            valuesContent: |-
              deployment:
                kind: DaemonSet
              updateStrategy:
                rollingUpdate:
                  maxUnavailable: 1
                  maxSurge: 0
              hostNetwork: true
              podSecurityContext:
                runAsNonRoot: false
                runAsUser: 0
              securityContext:
                capabilities:
                  add:
                    - NET_BIND_SERVICE
                  drop:
                    - ALL
              service:
                type: ClusterIP
              ports:
                web:
                  port: 80
                  exposedPort: 80
                  containerPort: 80
                websecure:
                  port: 443
                  exposedPort: 443
                  containerPort: 443
      when: inventory_hostname in groups['vyom_control_plane']

    - name: ☸️ Bootstrap K3s (Split-Horizon)
      include_role:
        name: xanmanning.k3s
        apply:
          become: true
      vars:
        k3s_become: true

        # Explicit Group Mapping (Resolves k3s_server variable collision)
        k3s_group_server: "vyom_control_plane"
        k3s_group_agent: "vyom_workers"

        # Network Binding (Fast Lane)
        k3s_node_ip: "{{ k3s_node_ip }}"
        k3s_flannel_iface: "{{ k3s_flannel_iface }}"

        k3s_server:
          # Secure the API Server with multiple identities
          tls-san:
            # A. The Secure Backdoor (For Lighthouse & Remote kubectl)
            - "{{ ansible_facts.nebula1.ipv4.address }}"
            # B. The Local Door (For LAN access)
            - "{{ ansible_facts.default_ipv4.address }}"
            # C. The DNS Name (For Ingress)
            - "k3s.brahmanda.local"

          # 5. Component Tuning
          # ---------------------------
          disable:
            - servicelb  # We don't need a LoadBalancer yet
            # - traefik    # We will deploy Ingress via GitOps (Sankalpa)
          kube-controller-manager-arg:
            - "bind-address=0.0.0.0" # Allow metrics scraping
          kube-scheduler-arg:
            - "bind-address=0.0.0.0"

          # 6. Kubelet Tuning (For System Stability)
          kubelet-arg:
            # Reserve resources for the OS so K3s doesn't OOM the host
            - "system-reserved=cpu=500m,memory=500Mi"
            - "kube-reserved=cpu=500m,memory=500Mi"

    # -------------------------------------------------------------------------
    # Phase 4: System Hardening (Conditional Reboot)
    # -------------------------------------------------------------------------
    - name: 🔍 Check if System Reboot is Required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: 🔄 Reboot Nodes if Required (Kernel/System Updates)
      ansible.builtin.reboot:
        msg: "Rebooting to apply system updates and ensure clean kernel state"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required_file.stat.exists

    - name: ⏳ Ensure K3s Service is Running (Post-Reboot)
      ansible.builtin.systemd:
        name: "{{ 'k3s' if inventory_hostname in groups['vyom_control_plane'] else 'k3s-agent' }}"
        state: started
        enabled: true
      when: reboot_required_file.stat.exists
      ignore_errors: true

    - name: ⏳ Wait for K3s Service to be Active (Post-Reboot)
      ansible.builtin.command:
        cmd: "systemctl is-active {{ 'k3s' if inventory_hostname in groups['vyom_control_plane'] else 'k3s-agent' }}"
      register: k3s_service_check
      until: k3s_service_check.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      when: reboot_required_file.stat.exists
      ignore_errors: true

  post_tasks:
    - name: ✅ Verify Node Identity
      debug:
        msg: "Node {{ inventory_hostname }} active. LAN: {{ ansible_facts.default_ipv4.address }}, Mesh: {{ ansible_facts.nebula1.ipv4.address | default('Unknown') }}"

    - name: 🔍 Test Nebula Connectivity to Lighthouse
      ansible.builtin.command:
        cmd: ping -c 3 -W 5 10.100.0.1
      register: lighthouse_ping
      failed_when: lighthouse_ping.rc != 0
      changed_when: false

    - name: ✅ Lighthouse Connectivity
      debug:
        msg: "✓ Nebula mesh connectivity to Lighthouse (10.100.0.1) verified"
      when: lighthouse_ping.rc == 0

    - name: 🔍 Test Nebula Connectivity Between Nodes (Control Plane Only)
      ansible.builtin.command:
        cmd: ping -c 2 -W 5 {{ hostvars[item].ansible_facts.nebula1.ipv4.address }}
      loop: "{{ groups['vyom_workers'] }}"
      register: worker_ping
      failed_when: false
      changed_when: false
      when: inventory_hostname in groups['vyom_control_plane']

    - name: ✅ Inter-Node Connectivity Status
      debug:
        msg: "{% if worker_ping.results | selectattr('rc', 'equalto', 0) | list | length == groups['vyom_workers'] | length %}✓ All workers reachable via Nebula mesh{% else %}⚠ Some workers unreachable - check Nebula certificates{% endif %}"
      when: inventory_hostname in groups['vyom_control_plane'] and worker_ping.results is defined
